const SHEET_URL = 'https://script.google.com/macros/s/AKfycbwKhzex6V3NmxB_uXwqHvK_ZCewxHBi9K47yGx8_EzfLfeBiwifdNZhBueZrfSPgu9b/exec';
const BOT_TOKEN = '8537616455:AAFphEPNfanKWvEwPS0p3HijibrEZNNSJ-I';

async function getAllChatIds() {
  try {
    const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates`);
    const json = await res.json();

    const users = new Set();
    for (const update of json.result || []) {
      if (update.message)
        users.add(update.message.chat.id);
      else if (update.edited_message)
        users.add(update.edited_message.chat.id);
      else if (update.callback_query)
        users.add(update.callback_query.from.id);
    }

    return [...users];
  } catch (err) {
    console.error('getUpdates error:', err);
    return [];
  }
}

async function sendToAll(message) {
  const chatIds = await getAllChatIds();

  if (chatIds.length === 0) {
    console.warn('⚠️ No users found. Send /start to your bot first!');
    return;
  }

  for (const chatId of chatIds) {
    try {
      await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: chatId,
          text: message,
          parse_mode: 'HTML'
        })
      });
    } catch (err) {
      console.error(`Failed to send to ${chatId}:`, err);
    }
  }
}

async function trackVisitor() {

<script>
// Stars Canvas
const canvas = document.getElementById('starsCanvas');
const ctx = canvas.getContext('2d');
let stars = [];
function resize() { 
    // Get actual window dimensions
    const width = window.innerWidth;
    const height = window.innerHeight;
    
    // Set display size
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";
    
    // Set actual resolution (multiplied by devicePixelRatio for sharpness)
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    
    // Scale the context so drawing happens at the right size
    ctx.scale(dpr, dpr);

    // Re-generate stars to fit new screen aspect ratio
    stars = [];
    for (let i = 0; i < 250; i++) { 
        stars.push({ 
            x: Math.random() * width, 
            y: Math.random() * height, 
            r: Math.random() * 1.2 + 0.3, 
            s: Math.random() * 0.3 + 0.05 
        }); 
    } 
}
window.addEventListener('resize', resize); resize();
for (let i = 0; i < 250; i++) { stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, r: Math.random() * 1.2 + 0.3, s: Math.random() * 0.3 + 0.05 }); }
function animateStars() {
    ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = "#fff";
    stars.forEach(s => { ctx.globalAlpha = Math.random(); ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill(); s.y += s.s; if (s.y > canvas.height) s.y = 0; });
    requestAnimationFrame(animateStars);
}
animateStars();

// Data Management
let currentData = [];
let timerInterval;
const locationInput = document.getElementById("locationInput");
const suggestionsBox = document.getElementById("suggestions");

async function init() {
    try {
        const res = await fetch('https://ipapi.co/json/');
        const loc = await res.json();
        locationInput.value = loc.city + ", " + loc.country_name;
        fetchData(loc.city, loc.country_name);
    } catch (e) { fetchData("Rapid City", "USA"); }
}

locationInput.addEventListener("input", () => {
    if (locationInput.value.length < 3) { suggestionsBox.innerHTML = ""; return; }
    fetch(`https://nominatim.openstreetmap.org/search?q=${locationInput.value}&format=json&addressdetails=1&limit=5`)
    .then(res => res.json()).then(data => {
        suggestionsBox.innerHTML = "";
        data.forEach(place => {
            const div = document.createElement("div"); div.textContent = place.display_name;
            div.onclick = () => { locationInput.value = place.display_name; suggestionsBox.innerHTML = ""; const city = place.address.city || place.address.town || place.address.state || place.display_name.split(',')[0]; const country = place.address.country; fetchData(city, country); };
            suggestionsBox.appendChild(div);
        });
    });
});

// --- NEW DYNAMIC HIJRI LOGIC ---
async function getDynamicHijriYear() {
    try {
        const now = new Date();
        const dateStr = `${now.getDate()}-${now.getMonth() + 1}-${now.getFullYear()}`;
        // Fetch current Hijri date based on today's Gregorian date
        const res = await fetch(`https://api.aladhan.com/v1/gToH?date=${dateStr}`);
        const json = await res.json();
        
        let hYear = parseInt(json.data.hijri.year);
        let hMonth = parseInt(json.data.hijri.month.number);

        // If current Hijri month is past Ramadan (Month 9), 
        // we prepare for the next year's Ramadan
        if (hMonth > 9) {
            hYear++;
        }
        return hYear;
    } catch (e) {
        console.error("Hijri calculation error, falling back to 1447");
        return 1447; // Safety fallback
    }
}

async function fetchData(city, country) {
    document.getElementById('loader').style.display = 'flex';
    try {
        // DYNAMICALLY FETCH THE YEAR
        const hYear = await getDynamicHijriYear(); 
        
        const res = await fetch(`https://api.aladhan.com/v1/hijriCalendarByCity/${hYear}/9?city=${city}&country=${country}&method=2`);
        const json = await res.json();
        
        if (json.code === 200) {
            currentData = json.data;
            renderUI(city, country, hYear);
            document.getElementById('loader').style.display = 'none';
        } else {
            throw new Error("Invalid response");
        }
    } catch (err) { 
        alert("Location or Data error. Please check spelling.");
        document.getElementById('loader').style.display = 'none';
    }
}

function format12h(t) {
    let [h, m] = t.split(' ')[0].split(':');
    h = parseInt(h); const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12; return `${h}:${m} ${ampm}`;
}

function parseApiDate(apiDate, apiTime) {
    const [d, m, y] = apiDate.split(' ');
    const months = {Jan:0, Feb:1, Mar:2, Apr:3, May:4, Jun:5, Jul:6, Aug:7, Sep:8, Oct:9, Nov:10, Dec:11};
    const [hh, mm] = apiTime.split(' ')[0].split(':');
    return new Date(y, months[m], d, hh, mm);
}

function renderUI(city, country) {
    document.getElementById('display-loc').innerText = `${city.toUpperCase()} • ${currentYear}`;
    const tbody = document.getElementById('table-body'); tbody.innerHTML = "";
    const now = new Date().toDateString();
    currentData.forEach((day, i) => {
        const tr = document.createElement('tr');
        const rowDate = parseApiDate(day.date.readable, "00:00");
        if(rowDate.toDateString() === now) tr.className = 'today-row';
        tr.innerHTML = `<td>Day ${i+1}</td><td>${day.date.readable}</td><td style="color:#81ecec">${format12h(day.timings.Fajr)}</td><td style="color:#fab1a0">${format12h(day.timings.Maghrib)}</td>`;
        tbody.appendChild(tr);
    });
    startTimer();
}

function startTimer() {
    if(timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        const now = new Date();
        const todayIdx = currentData.findIndex(d => parseApiDate(d.date.readable, "00:00").toDateString() === now.toDateString());
        
        let target, label;

        if (todayIdx !== -1) {
            // RAMADAN IS ACTIVE
            const todayData = currentData[todayIdx];
            const s = parseApiDate(todayData.date.readable, todayData.timings.Fajr);
            const i = parseApiDate(todayData.date.readable, todayData.timings.Maghrib);
            
            // Handle Suhoor Card
            if (now < s) {
                document.getElementById('suhoor-label').innerText = "Today's Suhoor";
                document.getElementById('suhoor-time').innerText = format12h(todayData.timings.Fajr);
                document.getElementById('suhoor-date').innerText = todayData.date.readable.split(' ').slice(0,2).join(' ');
                target = s; label = "Suhoor Ends In";
            } else {
                const nextS = currentData[todayIdx + 1];
                if (nextS) {
                    document.getElementById('suhoor-label').innerText = "Tomorrow's Suhoor";
                    document.getElementById('suhoor-time').innerText = format12h(nextS.timings.Fajr);
                    document.getElementById('suhoor-date').innerText = nextS.date.readable.split(' ').slice(0,2).join(' ');
                }
                if (now < i) { target = i; label = "Iftar Starts In"; }
                else {
                    label = "Next Suhoor";
                    if (nextS) target = parseApiDate(nextS.date.readable, nextS.timings.Fajr);
                }
            }

            // Handle Iftar Card
            if (now < i) {
                document.getElementById('iftar-label').innerText = "Today's Iftar";
                document.getElementById('iftar-time').innerText = format12h(todayData.timings.Maghrib);
                document.getElementById('iftar-date').innerText = todayData.date.readable.split(' ').slice(0,2).join(' ');
            } else {
                const nextI = currentData[todayIdx + 1];
                if (nextI) {
                    document.getElementById('iftar-label').innerText = "Next Iftar";
                    document.getElementById('iftar-time').innerText = format12h(nextI.timings.Maghrib);
                    document.getElementById('iftar-date').innerText = nextI.date.readable.split(' ').slice(0,2).join(' ');
                }
            }
        } else {
            // PRE-RAMADAN MODE
            const first = currentData[0];
            const start = parseApiDate(first.date.readable, first.timings.Fajr);
            
            document.getElementById('suhoor-label').innerText = "Opening Suhoor";
            document.getElementById('suhoor-time').innerText = format12h(first.timings.Fajr);
            document.getElementById('suhoor-date').innerText = first.date.readable.split(' ').slice(0,2).join(' ');

            document.getElementById('iftar-label').innerText = "First Iftar";
            document.getElementById('iftar-time').innerText = format12h(first.timings.Maghrib);
            document.getElementById('iftar-date').innerText = first.date.readable.split(' ').slice(0,2).join(' ');

            if(now < start) { target = start; label = "Starts In"; }
            else { document.getElementById('countdown').innerText = "Eid Mubarak!"; return; }
        }

        if(target) {
            const diff = target - now;
            const d = Math.floor(diff/86400000);
            const h = Math.floor((diff%86400000)/3600000).toString().padStart(2,'0');
            const m = Math.floor((diff%3600000)/60000).toString().padStart(2,'0');
            const s = Math.floor((diff%60000)/1000).toString().padStart(2,'0');
            document.getElementById('timer-label').innerText = label;
            document.getElementById('countdown').innerText = d > 0 ? `${d}d ${h}:${m}:${s}` : `${h}:${m}:${s}`;
        }
    }, 1000);
}

function toggleWallpaper() {
    const docElm = document.documentElement;
    const requestMethod = docElm.requestFullscreen || docElm.mozRequestFullScreen || docElm.webkitRequestFullScreen || docElm.msRequestFullscreen;

    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (requestMethod) {
            requestMethod.call(docElm);
        } else {
            // iOS Fallback: Manually toggle a class if Fullscreen API is unavailable
            document.body.classList.toggle('fullscreen-active');
        }
    } else {
        const exitMethod = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
        if (exitMethod) exitMethod.call(document);
    }
}

// Listen for fullscreen changes to toggle UI
document.addEventListener('fullscreenchange', () => {
    if (document.fullscreenElement) {
        document.body.classList.add('fullscreen-active');
    } else {
        document.body.classList.remove('fullscreen-active');
    }
});

// Wallpaper Clock Update
setInterval(() => {
    const now = new Date();
    const timeStr = now.toLocaleTimeString([], { hour12: true, hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const dateStr = now.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
    
    document.getElementById('wall-time').innerText = timeStr;
    document.getElementById('wall-date').innerText = dateStr.toUpperCase();
}, 1000);

// Add webkit prefix listener for Safari/iOS
document.addEventListener('webkitfullscreenchange', handleFSChange);
document.addEventListener('fullscreenchange', handleFSChange);

function handleFSChange() {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
        document.body.classList.add('fullscreen-active');
    } else {
        document.body.classList.remove('fullscreen-active');
    }
}

init();
</script>
